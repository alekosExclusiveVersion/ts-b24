<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний Ти-Би-24</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e6e8ec; --muted:#9aa3b2; --accent:#4c8bf5; --accent2:#7aa7ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px}
.container{max-width:960px;margin:0 auto;padding:20px}
header{padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
header h1{font-size:20px;margin:0;font-weight:600}
header .sub{color:var(--muted);margin-top:2px;font-size:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px;background:var(--panel);padding:12px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:12px}
.filters input,.filters select{background:var(--panel2);border:1px solid var(--border);
  color:var(--text);padding:7px 9px;border-radius:6px;font-size:13px;width:100%}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1;background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px}
.searchrow input:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);border:none;color:#fff;padding:10px 18px;
  border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
button:hover{background:var(--accent2)}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .title{font-weight:600;font-size:14px}
.card .date{color:var(--muted);font-size:12px;white-space:nowrap}
.card .company{color:var(--accent2);font-size:12px;margin-top:2px}
.card .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:20px}
.tag.hl{color:var(--accent2);border-color:var(--accent)}
.card .snippet{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5;
  max-height:64px;overflow:hidden;-webkit-line-clamp:3;display:-webkit-box;
  -webkit-box-orient:vertical}
.nav{display:flex;gap:8px;align-items:center;margin:14px 0;color:var(--muted);font-size:13px}
.nav button{padding:6px 12px;font-size:13px}
#detail{display:none;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:14px}
#detail h2{margin:0 0 10px;font-size:17px}
#detail .back{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  padding:6px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}
#detail table{width:100%;border-collapse:collapse;font-size:13px}
#detail td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
#detail td:first-child{color:var(--muted);white-space:nowrap;width:180px}
#detail pre{white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:8px;
  font-family:inherit;line-height:1.55;max-height:400px;overflow:auto}
#detail h3{font-size:14px;margin:16px 0 8px}
.links a{color:var(--accent2);text-decoration:none;margin-right:12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.err{color:#ff7a7a;text-align:center;padding:20px}
.spinner{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>База знаний Ти-Би-24</h1>
    <div class="sub">Поиск по сделкам Б24 · <span id="dbinfo"></span></div>
  </header>

  <div class="searchrow">
    <input id="q" placeholder="Поиск: текст, фраза, компания..." >
    <button id="btnSearch">Найти</button>
  </div>

  <div class="filters">
    <select id="fCategory"><option value="">Вся категория</option></select>
    <select id="fAssigned"><option value="">Любой ответственный</option></select>
    <input type="date" id="fFrom" placeholder="с даты">
    <input type="date" id="fTo" placeholder="по дату">
  </div>

  <div id="detail"></div>
  <div id="results"></div>
  <div class="nav" id="nav" style="display:none">
    <button id="btnPrev">← Назад</button>
    <span id="pageinfo"></span>
    <button id="btnNext">Вперёд →</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = { q:"", category:"", assigned:"", from:"", to:"", offset:0, limit:50 };

function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url){
  const r = await fetch(url);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}

async function loadMeta(){
  try{
    const m = await api("/api/meta");
    const sel = $("fCategory");
    sel.innerHTML = '<option value="">Вся категория</option>';
    m.categories.forEach(c => {
      const o = document.createElement("option");o.value=c.ID;o.textContent=`${c.ID}: ${c.NAME}`;
      sel.appendChild(o);
    });
    const a = $("fAssigned");
    a.innerHTML = '<option value="">Любой ответственный</option>';
    m.assigned.forEach(u => {
      const o = document.createElement("option");o.value=u.id;
      o.textContent = u.name ? `${u.name} (${u.id})` : `ID ${u.id}`;
      a.appendChild(o);
    });
    $("dbinfo").textContent = `категорий: ${m.categories.length}`;
  }catch(e){}
}

function snippet(comments){
  if(!comments||!comments.trim())return "";
  const t = comments.trim();
  const norm = t.replace(/\s+/g," ");
  return norm.length>220 ? norm.slice(0,220)+"…" : norm;
}

async function doSearch(resetOffset){
  state.q = $("q").value;
  state.category = $("fCategory").value;
  state.assigned = $("fAssigned").value;
  state.from = $("fFrom").value;
  state.to = $("fTo").value;
  if(resetOffset) state.offset = 0;
  $("results").innerHTML = '<div class="spinner">Поиск…</div>';
  $("detail").style.display="none";$("detail").innerHTML="";
  const qs = new URLSearchParams(state).toString();
  try{
    const res = await api("/api/search?"+qs);
    $("nav").style.display = res.total ? "flex" : "none";
    $("pageinfo").textContent = `${res.total} результатов · показано ${res.offset+1}–${Math.min(res.offset+res.limit,res.total)}`;
    const r = $("results");
    r.innerHTML = "";
    if(!res.items.length){r.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
    $("btnPrev").disabled = res.offset===0;
    $("btnNext").disabled = res.offset+res.limit>=res.total;
    res.items.forEach(d=>{
      const dlg = document.createElement("div");
      dlg.className="card";
      dlg.innerHTML = `
        <div class="top"><div class="title">#${esc(d.ID)} ${esc(d.TITLE)}</div>
          <div class="date">${esc(d.DATE_CREATE)}</div></div>
        ${d.company_title?`<div class="company">${esc(d.company_title)}</div>`:""}
        <div class="tags">
          <span class="tag">кат ${esc(d.CATEGORY_ID)}</span>
          <span class="tag">${esc(d.stage_name||("стадия "+d.STAGE_ID))}</span>
          ${d.OPPORTUNITY && d.CATEGORY_ID!=="1"?`<span class="tag hl">${esc(d.OPPORTUNITY)} ₽</span>`:""}
          <span class="tag">${esc(d.assigned_name||d.ASSIGNED_BY_ID||"—")}</span>
        </div>
        ${d.comments&&d.comments.trim()?`<div class="snippet">${esc(snippet(d.comments))}</div>`:""}`;
      dlg.onclick=()=>openDeal(d.ID);
      r.appendChild(dlg);
    });
  }catch(e){
    $("results").innerHTML = `<div class="err">Ошибка: ${esc(e.message)}</div>`;
    $("nav").style.display="none";
  }
}

async function openDeal(id){
  try{
    const d = await api("/api/deal?id="+encodeURIComponent(id));
    const det = $("detail");
    const fields = [
      ["ID", d.ID],["Название", d.TITLE],["Компания", d.company_title||"-"],
      ["Категория", d.category_name?`${d.CATEGORY_ID}: ${d.category_name}`:d.CATEGORY_ID],
      ["Стадия", d.stage_name?Array.isArray(d.stage_name)?d.stage_name[0]:d.stage_name:"-"],
      ["Ответственный", d.assigned_name ? `${d.assigned_name} (${d.ASSIGNED_BY_ID})` : (d.ASSIGNED_BY_ID||"-")],["Дата создания", d.DATE_CREATE],
      ["Сумма", d.CATEGORY_ID==="1" ? "-" : (d.OPPORTUNITY?d.OPPORTUNITY+" ₽":"-")],
      ["Источник", d.SOURCE_ID||"-"]
    ];
    let rows = fields.map(f=>`<tr><td>${esc(f[0])}</td><td>${esc(f[1])}</td></tr>`).join("");
    det.innerHTML = `
      <button class="back" onclick="$('detail').style.display='none'">← Закрыть</button>
      <h2>#${esc(d.ID)} ${esc(d.TITLE)}</h2>
      <table>${rows}</table>
      <h3>Комментарии</h3>
      <pre>${d.COMMENTS?esc(d.COMMENTS):"— нет комментариев —"}</pre>
      ${d.contacts&&d.contacts.length?`<h3>Контакты</h3><table>${
        d.contacts.map(k=>`<tr><td>${esc(k.NAME_LAST)}</td><td>${esc(k.PHONE||"")} ${esc(k.EMAIL||"")}</td></tr>`).join("")
      }</table>`:""}
      ${d.company_deals&&d.company_deals.length?`<h3>История по компании (${d.company_deals.length})</h3><div class="links">${
        d.company_deals.map(cd=>`<a href="#" onclick="openDeal('${cd.ID}')">#${cd.ID} ${esc(cd.TITLE)}</a>`).join("")
      }</div>`:""}`;
    det.style.display="block";
    det.scrollIntoView({behavior:"smooth"});
  }catch(e){alert(e.message);}
}

$("btnSearch").onclick=()=>doSearch(true);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch(true)});
["fCategory","fAssigned","fFrom","fTo"].forEach(id=>$(id).onchange=()=>doSearch(true));
$("btnPrev").onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);doSearch(false);};
$("btnNext").onclick=()=>{state.offset+=state.limit;doSearch(false);};

loadMeta();
</script>
</body>
</html>
